# SilentOdt.properties - TEMPLATE (align layout with the sample in your utility's resource folder)
# Encrypt values marked <ENC> with ODTPassEncryption.bat/.sh using SymmetricKey (exactly 16 chars)

# ODT data source
OdtJdbcUrl=<ENC jdbc:oracle:thin:@<host>:<port>:<sid>>
OdtDbUser=<ODT_SCHEMA_USER>
OdtDbPassword=<ENC password>
SymmetricKey=<16_CHAR_KEY>

# Logger
Logreqd=Y
Logpath=<D:/odt_silent/logs/>
Level=INFO

# System
JAVA_HOME=<C:/Program Files/Java/jdk>
WEBLOGIC_HOME=<optional, for Ant templates>
WAS_HOME=<optional, for Ant templates>
