# ODTOperations.properties - TEMPLATE. Operations run in numbered order.
# LOGIN and SETRELEASE are mandatory and must come first.
# Keep only the blocks you need and renumber. Align key layout with your utility's sample file.

1.operation=LOGIN
1.Userid=<ODT_USER>
1.password=<ENC odt password>

2.operation=SETRELEASE
2.relCode=<RELEASE_CODE>
2.envCode=<ENV_CODE>
2.langCode=ENG

# --- Upgrade custom radxmls onto a new kernel/cluster base -----------------
3.operation=REFRESH
3.refreshType=SOURCE_REFRESH
3.srcFileList=<D:/odt/lists/custom_radxmls.txt>
3.baseFileList=<D:/odt/lists/kernel_radxmls.txt>
3.srcRelType=CUSTOM
3.baseRelType=KERNEL
3.destpath=<D:/odt/refreshed/>

# --- Regenerate units -------------------------------------------------------
4.operation=BULKGENERATION
4.radxmlListFile=<D:/odt/lists/radxmls.txt>
# 4.srcPath=<folder>   (alternative to radxmlListFile; list file wins if both)
4.fileType=EXTENSIBLE
4.gen=UIXML,SYS_JS,MAIN_SPC,MAIN_SQL,XSD_FILES,MENU_DETAILS,LABEL_DETAILS,AMEND_DETAILS,SUMMARY_DETAILS,SCREEN_DETAILS,LOV_DETAILS,BLOCK_PK_COLS,CALL_FORM_DETAILS,BLOCK_DETAILS,DATASCR_DETAILS,FUNCTION_CALL_FORMS,GATEWAY_DETAILS
4.destPath=<D:/odt/generated/>

# --- SOAP web service artifacts ------------------------------------------------
# 5.operation=SXML_BULKGENERATION
# 5.sxmlListFile=<D:/odt/lists/sxml.txt>
# 5.radxmlListFile=<D:/odt/lists/radxmls.txt>
# 5.xsdListFile=<D:/odt/lists/xsds.txt>
# 5.gen=IMPL_FILE,CONFIG_FILES,WSDL_FILE,XSD_FILES,GW_WS_PROP_FILES,ANT_BUILD
# 5.nonExtServicesReqd=N
# 5.validateXsds=Y
# 5.destpath=<D:/odt/ws/>

